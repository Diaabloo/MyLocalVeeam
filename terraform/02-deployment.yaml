# ==============================================================================
# Kubernetes Deployment
# Description: Deploys the MyLocalVeeam Go API to the AKS Cluster.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mylocalveeam-api
  namespace: default
  labels:
    app: mylocalveeam-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mylocalveeam-api
  template:
    metadata:
      labels:
        app: mylocalveeam-api
    spec:
      containers:
        - name: api
          # Best Practice: Use a specific release tag or Git SHA instead of 'latest'
          image: ghcr.io/diaabloo/mylocalveeam-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          # Sensitive variables should be injected via Kubernetes Secrets or Azure KeyVault CSI
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DB_PASSWORD
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: VAULT_TOKEN
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MINIO_SECRET_KEY