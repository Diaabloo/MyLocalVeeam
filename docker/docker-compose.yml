services:
  production_db:
    image: postgres:15-alpine
    container_name: production_db
    environment:
      POSTGRES_DB: app_production
      POSTGRES_USER: ubs_prod_user
      POSTGRES_PASSWORD: SecretProdPassword123!
    ports:
      - "5432:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    networks:
      - veeam_network

  minio_s3:
    image: minio/minio:latest
    container_name: minio_s3
    environment:
      MINIO_ROOT_USER: minio_root_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_99
    command: server /data --console-address ":9001"
    ports:
      - "9005:9000"
      - "9001:9001"
    volumes:
      - minio_backup_data:/data
    networks:
      - veeam_network

  vault_kms:
    image: hashicorp/vault:1.15
    container_name: vault_kms
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: veeam-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: >
      sh -c "vault server -dev -dev-root-token-id=\"$${VAULT_DEV_ROOT_TOKEN_ID}\" -dev-listen-address=\"$${VAULT_DEV_LISTEN_ADDRESS}\" -log-level=warn & /vault/config/vault-init.sh && wait"
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config:/vault/config
    networks:
      - veeam_network

  veeam_api:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: veeam_api
    ports:
      - "8080:8080"
    environment:
      PGHOST: production_db
      PGPORT: "5432"
      PGDATABASE: app_production
      PGUSER: ubs_prod_user
      DB_PASSWORD: SecretProdPassword123!
      VAULT_ADDR: http://vault_kms:8200
      VAULT_TOKEN: veeam-root-token
      VAULT_SECRET_PATH: secret/data/backups/postgres
      VAULT_SECRET_KEY: passphrase
      MINIO_ENDPOINT: http://minio_s3:9000
      MINIO_ACCESS_KEY: minio_root_admin
      MINIO_SECRET_KEY: minio_secure_password_99
      MINIO_BUCKET: secure-backups
    depends_on:
      - production_db
      - minio_s3
      - vault_kms
    networks:
      - veeam_network

networks:
  veeam_network:
    driver: bridge

volumes:
  pg_prod_data:
  minio_backup_data: